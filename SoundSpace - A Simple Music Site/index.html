<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundSpace — Welcome</title>

  <!--
    ============================================================
    FONTS — loaded from Google Fonts (free CDN)
    We use two fonts:
      - "Bebas Neue" → big display headings (bold, musical feel)
      - "Inter"      → body text (clean, readable)
    ============================================================
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================================
       CSS RESET & ROOT VARIABLES
       Variables let you change the whole color scheme in one place.
       Try changing --accent to see what happens!
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0a0a0f;      /* near-black background */
      --surface:   #13131a;      /* slightly lighter surface (cards) */
      --accent:    #c0f;         /* electric purple — the signature color */
      --accent2:   #0cf;         /* cyan accent for variety */
      --text:      #e8e8f0;      /* off-white body text */
      --muted:     #666680;      /* subdued text */
      --radius:    12px;         /* rounded corners everywhere */
    }

    /* ============================================================
       BASE STYLES
    ============================================================ */
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;

      /* Subtle animated gradient background */
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(204,0,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,204,255,0.06) 0%, transparent 60%);
    }

    /* ============================================================
       HEADER / LOGO
    ============================================================ */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem); /* clamp = responsive font size */
      letter-spacing: 0.05em;
      line-height: 1;

      /* Gradient text trick */
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ============================================================
       CARD — the white box that holds the form
    ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;

      /* Soft glow shadow */
      box-shadow:
        0 0 0 1px rgba(204,0,255,0.1),
        0 20px 60px rgba(0,0,0,0.5);
    }

    .card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* ============================================================
       FORM ELEMENTS
    ============================================================ */
    .field {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    /* When user clicks into the input */
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(204,0,255,0.15);
    }

    /* ============================================================
       BUTTON
    ============================================================ */
    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      padding: 0.85rem;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover  { opacity: 0.85; }
    button:active { transform: scale(0.98); }

    /* ============================================================
       ERROR & SUCCESS MESSAGES
    ============================================================ */
    .message {
      font-size: 0.82rem;
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      display: none; /* hidden by default — JS shows it */
    }

    .message.error {
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff6b6b;
    }

    .message.success {
      background: rgba(0,255,160,0.08);
      border: 1px solid rgba(0,255,160,0.25);
      color: #00ffa0;
    }

    /* Already visited link */
    .already-in {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .already-in a {
      color: var(--accent2);
      text-decoration: none;
    }

    .already-in a:hover { text-decoration: underline; }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      margin-top: 3rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header>
    <div class="logo">SoundSpace</div>
    <p class="tagline">Your music. Your world.</p>
  </header>

  <!-- ============================================================
       REGISTRATION CARD
  ============================================================ -->
  <div class="card">
    <h2>Join the Frequency</h2>
    <p>Enter your name and email to access the music hub. No password, no spam — just sound.</p>

    <!--
      THE FORM
      We don't use <form action="..."> because we have no server.
      Instead, a button calls a JavaScript function directly.
    -->

    <div class="field">
      <label for="username">Username</label>
      <!--
        id="username"  → lets the label connect to this input
        placeholder    → grey hint text inside the box
      -->
      <input
        type="text"
        id="username"
        placeholder="e.g. bassline_hero"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
      />
    </div>

    <!-- onclick="registerUser()" → calls the JS function below when clicked -->
    <button onclick="registerUser()">Enter SoundSpace →</button>

    <!-- These divs are hidden; JS makes them visible when needed -->
    <div class="message error"  id="msg-error"></div>
    <div class="message success" id="msg-success"></div>

    <div class="already-in">
      Already joined? <a href="music.html">Go straight in →</a>
    </div>
  </div>

  <footer>
    Built to learn · Hosted free on GitHub Pages<br />
    Data stored in your browser (localStorage) — never sent anywhere
  </footer>

  <!-- ============================================================
       JAVASCRIPT — the brain of the page
       This section handles form logic and the "database"
  ============================================================ -->
  <script>

    // ============================================================
    // WHAT IS localStorage?
    //
    // localStorage is a mini key-value store built into every browser.
    // It works like a dictionary:
    //   localStorage.setItem("key", "value")   → save
    //   localStorage.getItem("key")            → read
    //   localStorage.removeItem("key")         → delete
    //
    // Data persists even after closing the browser.
    // It is scoped to the domain — github.io users share one space.
    //
    // LIMITATION: It only lives in THIS browser on THIS device.
    // To scale to a real multi-user DB → swap for Firebase/Supabase later.
    // ============================================================


    // Run this as soon as the page loads.
    // If the user already registered, skip the form and go straight to music.html
    window.onload = function () {
      const currentUser = localStorage.getItem('soundspace_current_user');
      if (currentUser) {
        // They already filled in their info — send them to the music page
        window.location.href = 'music.html';
      }
    };


    // ============================================================
    // registerUser()
    // Called when the "Enter SoundSpace" button is clicked.
    // ============================================================
    function registerUser() {

      // 1. Grab what the user typed
      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();

      // 2. Simple validation
      if (!username || !email) {
        showMessage('error', 'Please fill in both fields.');
        return; // stop here — don't continue
      }

      // Basic email check: must contain "@" and "."
      if (!email.includes('@') || !email.includes('.')) {
        showMessage('error', 'That email doesn\'t look right. Try again.');
        return;
      }

      // 3. Read existing users from localStorage
      //    getItem returns null if nothing saved yet, so we use "|| '[]'"
      //    to default to an empty JSON array string.
      const existingRaw  = localStorage.getItem('soundspace_users') || '[]';

      // JSON.parse turns the string '[ {...}, {...} ]' into a real JS array
      const existingUsers = JSON.parse(existingRaw);

      // 4. Check if this email is already in our list
      const alreadyExists = existingUsers.some(u => u.email === email);

      if (alreadyExists) {
        // Welcome back! Just log them in without duplicating
        showMessage('success', `Welcome back! Sending you in…`);
        localStorage.setItem('soundspace_current_user', JSON.stringify({ username, email }));

        // Wait 1.2 seconds so they see the message, then redirect
        setTimeout(() => { window.location.href = 'music.html'; }, 1200);
        return;
      }

      // 5. New user! Build a user object
      const newUser = {
        username:  username,
        email:     email,
        joinedAt:  new Date().toISOString(), // e.g. "2024-06-09T14:30:00.000Z"
      };

      // 6. Add them to the list
      existingUsers.push(newUser);

      // 7. Save the updated list back to localStorage
      //    JSON.stringify turns the JS array back into a string for storage
      localStorage.setItem('soundspace_users', JSON.stringify(existingUsers));

      // 8. Also save who is currently logged in
      localStorage.setItem('soundspace_current_user', JSON.stringify(newUser));

      // 9. Feedback and redirect
      showMessage('success', `You're in, ${username}! Loading your space…`);
      setTimeout(() => { window.location.href = 'music.html'; }, 1200);
    }


    // ============================================================
    // showMessage(type, text)
    // Helper: shows either the error box or the success box.
    // ============================================================
    function showMessage(type, text) {
      // Hide both first
      document.getElementById('msg-error').style.display   = 'none';
      document.getElementById('msg-success').style.display = 'none';

      // Show the right one
      const el = document.getElementById('msg-' + type);
      el.textContent    = text;
      el.style.display  = 'block';
    }

  </script>
</body>
</html>
